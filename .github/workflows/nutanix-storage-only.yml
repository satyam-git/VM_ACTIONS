name: Nutanix Storage Only

on:
  workflow_dispatch:
    inputs:
      site: { description: 'Site (Banglore/Chennai)', required: true }
      vmname: { description: 'VM Name', required: true }
      disk_action: { description: 'Action (add/none)', required: true, default: 'none' }
      disksize: { description: 'Disk Size (GB)', required: false, default: '0' }

jobs:
  run-storage:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Storage Script
        shell: powershell
        env:
          NUTANIX_USER: ${{ secrets.NUTANIX_USER }}
          NUTANIX_PASS: ${{ secrets.NUTANIX_PASS }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\nutanix-storage-only.ps1" -JsonInputs $env:INPUTS_JSON
