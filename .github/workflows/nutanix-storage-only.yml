name: Nutanix Storage Only

on:
  workflow_dispatch:
    inputs:
      pE_IP: { description: 'Cluster IP', required: true }
      vmname: { description: 'VM Name', required: true }
      disk_action: { description: 'Action (none/add)', required: true, default: 'none' }
      disksize: { description: 'Disk Size (GB)', required: false, default: '0' }

jobs:
  run-storage:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Storage Script
        # We use standard PowerShell to support the Nutanix Cmdlets/Snapins
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          # Passing inputs as environment variables for the script
          PE_IP: ${{ github.event.inputs.pE_IP }}
          VM_NAME: ${{ github.event.inputs.vmname }}
          DISK_ACTION: ${{ github.event.inputs.disk_action }}
          DISK_SIZE: ${{ github.event.inputs.disksize }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\nutanix-storage-only.ps1"
