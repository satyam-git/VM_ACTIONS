name: Nutanix VMResize_CPU&Mem

on:
  workflow_dispatch:
    inputs:
      s1: { description: '1: Site Name', required: false, type: choice, options: [None, Banglore, Chennai] }
      v1: { description: '1: VM Name', required: false, type: string }
      a1: { description: '1: Action', required: false, type: choice, options: [start, stop, restart, resize] }
      d1: { description: '1: Delay (min)', required: false, default: '0', type: string }
      cpu1: { description: '1: CPU Cores (for resize)', required: false, default: '0' }
      mem1: { description: '1: RAM GB (for resize)', required: false, default: '0' }
      s2: { description: '2: Site Name', required: false, type: choice, options: [None, Banglore, Chennai] }
      v2: { description: '2: VM Name', required: false, type: string }
      a2: { description: '2: Action', required: false, type: choice, options: [start, stop, restart, resize] }
      d2: { description: '2: Delay (min)', required: false, default: '0', type: string }
      cpu2: { description: '2: CPU Cores (for resize)', required: false, default: '0' }
      mem2: { description: '2: RAM GB (for resize)', required: false, default: '0' }
      s3: { description: '3: Site Name', required: false, type: choice, options: [None, Banglore, Chennai] }
      v3: { description: '3: VM Name', required: false, type: string }
      a3: { description: '3: Action', required: false, type: choice, options: [start, stop, restart, resize] }
      d3: { description: '3: Delay (min)', required: false, default: '0', type: string }
      cpu3: { description: '3: CPU Cores (for resize)', required: false, default: '0' }
      mem3: { description: '3: RAM GB (for resize)', required: false, default: '0' }

jobs:
  run-batch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Unified Nutanix Script
        shell: powershell
        env:
          NUTANIX_USER: ${{ secrets.NUTANIX_USER }}
          NUTANIX_PASS: ${{ secrets.NUTANIX_PASS }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\vmactions_unified.ps1" -JsonInputs $env:INPUTS_JSON
