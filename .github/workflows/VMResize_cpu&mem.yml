name: Nutanix VM Resize

on:
  workflow_dispatch:
    inputs:
      vmname:
        description: 'VM Name'
        required: true
      pE_IP:
        description: 'Cluster IP'
        required: true
      CPU_size:
        description: 'CPU Cores'
        required: true
      mem_size:
        description: 'Memory (GB)'
        required: true

jobs:
  run-compute-resize:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Compute Resize Script
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
        run: |
          $inputs = @{
            vmname     = "${{ github.event.inputs.vmname }}"
            pE_IP      = "${{ github.event.inputs.pE_IP }}"
            CPU_size   = "${{ github.event.inputs.CPU_size }}"
            mem_size   = "${{ github.event.inputs.mem_size }}"
          }
          $json = $inputs | ConvertTo-Json
          & "$env:GITHUB_WORKSPACE\Scripts\VMResize.ps1" -JsonInputs $json
