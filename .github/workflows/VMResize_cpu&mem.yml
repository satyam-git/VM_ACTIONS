name: Nutanix VMResize_cpu&mem

on:
  workflow_dispatch:
    inputs:
      vmname:
        description: 'VM Name(s) – comma-separated for multiple VMs'
        required: true
        type: string
      pE_IP:
        description: 'Cluster IP(s) – comma-separated (single value applies to all)'
        required: true
        type: string
      CPU_size:
        description: 'CPU Cores per VM – comma-separated (0 means keep current, single value applies to all)'
        required: true
        type: string
      mem_size:
        description: 'Memory (GB) per VM – comma-separated (0 means keep current, single value applies to all)'
        required: true
        type: string
      delay_mins:
        description: 'Delay (min) per VM – comma-separated (single value applies to all)'
        required: false
        default: '0'
        type: string

jobs:
  run-compute-resize:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Parallel Compute Resize
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\VMResize_cpu&mem.ps1" -JsonInputs $env:INPUTS_JSON

      - name: Display Execution Summary
        shell: powershell
        run: |
          if (Test-Path "data/vm_resize_log.csv") {
            "### Resize Execution Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "| VM Name | Cluster IP | CPU Final | Memory (GB) | Delay (min) | Status |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "| :--- | :--- | :--- | :--- | :--- | :--- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

            Import-Csv "data/vm_resize_log.csv" -Header "VMName","ClusterIP","FinalCPU","FinalMemGB","Delay","Status" | ForEach-Object {
              "| $($_.VMName) | $($_.ClusterIP) | $($_.FinalCPU) | $($_.FinalMemGB) | $($_.Delay) | $($_.Status) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
