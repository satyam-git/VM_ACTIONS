name: Nutanix VMResize_cpu&mem

on:
  workflow_dispatch:
    inputs:
      s1: { description: '1: Site', required: false, type: choice, options: [None, Banglore, Chennai] }
      v1: { description: '1: VM Name(s)', required: false }
      cpu1: { description: '1: CPU', required: false, default: '2' }
      mem1: { description: '1: RAM(GB)', required: false, default: '4' }
      d1: { description: '1: Delay(m)', required: false, default: '0' }
      s2: { description: '2: Site', required: false, type: choice, options: [None, Banglore, Chennai] }
      v2: { description: '2: VM Name(s)', required: false }
      cpu2: { description: '2: CPU', required: false, default: '2' }
      mem2: { description: '2: RAM(GB)', required: false, default: '4' }
      d2: { description: '2: Delay(m)', required: false, default: '0' }
      s3: { description: '3: Site', required: false, type: choice, options: [None, Banglore, Chennai] }
      v3: { description: '3: VM Name(s)', required: false }
      cpu3: { description: '3: CPU', required: false, default: '2' }
      mem3: { description: '3: RAM(GB)', required: false, default: '4' }
      d3: { description: '3: Delay(m)', required: false, default: '0' }
      # ... s2, v2, cpu2, mem2, d2 మరియు s3, v3, cpu3, mem3, d3 సెట్లు యాడ్ చేసుకోండి

jobs:
  run-resize:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Resize
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\VMResize_cpu&mem.ps1" -JsonInputs $env:INPUTS_JSON
