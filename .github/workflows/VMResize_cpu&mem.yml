name: Nutanix VMResize_cpu&mem

on:
  workflow_dispatch:
    inputs:
      # Set 1
      s1: { description: '1: Site Name', required: false, type: choice, options: [None, Bangalore, Pune, Chennai] }
      v1: { description: '1: VM Names', required: false, type: string }
      c1: { description: '1: CPU Cores', required: false, type: string }
      m1: { description: '1: Memory (GB)', required: false, type: string }
      d1: { description: '1: Delay (min)', required: false, default: '0', type: string }
      # Set 2
      s2: { description: '2: Site Name', required: false, type: choice, options: [None, Bangalore, Pune, Chennai] }
      v2: { description: '2: VM Names', required: false, type: string }
      c2: { description: '2: CPU Cores', required: false, type: string }
      m2: { description: '2: Memory (GB)', required: false, type: string }
      d2: { description: '2: Delay (min)', required: false, default: '0', type: string }
      # Set 3
      s3: { description: '3: Site Name', required: false, type: choice, options: [None, Bangalore, Pune, Chennai] }
      v3: { description: '3: VM Names', required: false, type: string }
      c3: { description: '3: CPU Cores', required: false, type: string }
      m3: { description: '3: Memory (GB)', required: false, type: string }
      d3: { description: '3: Delay (min)', required: false, default: '0', type: string }

jobs:
  run-compute-resize:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Compute Resize
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\VMResize_cpu&mem.ps1" -JsonInputs $env:INPUTS_JSON
