name: Nutanix VM Disk Resizing

on:
  workflow_dispatch:
    inputs:
      site_name:
        description: "Site Name"
        required: true
        default: Banglore
        type: choice
        options:
          - Banglore
          - Chennai
          - CPune
      vmname:
        description: "VM Name"
        required: true
        type: string
      disk_action:
        description: "Disk Action"
        required: true
        default: add
        type: choice
        options:
          - add
          - extend
      SizeGB:
        description: "Target Disk Size (GB)"
        required: true
        type: string
      DiskAddr:
        description: "Disk Address (Required for extend)"
        required: true
        default: none
        type: choice
        options:
          - none
          - scsi.0
          - scsi.1
          - scsi.2
          - scsi.3
          - scsi.4
      GuestIP:
        description: "Windows Guest VM IP"
        required: true
        type: string
      DriveLetter:
        description: "Drive Letter (e.g. E)"
        required: true
        type: string

jobs:
  provision-disk:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Posh-SSH
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Posh-SSH)) {
            Install-Module Posh-SSH -Scope CurrentUser -Force -AllowClobber
          }

      - name: Configure WinRM TrustedHosts
        shell: powershell
        run: |
          try {
            # Ensure the self-hosted runner trusts all Guest VM connections
            Set-Item WSMan:\localhost\Client\TrustedHosts -Value "*" -Force
            Write-Host "WinRM TrustedHosts configured to trust guest IPs successfully."
          } catch {
            Write-Warning "Could not write TrustedHosts: $($_.Exception.Message). Script will fallback to dynamic local settings."
          }

      - name: Execute Disk Provisioning
        shell: powershell
        env:
          PE_USERNAME: ${{ secrets.PE_USERNAME }}
          PE_PASSWORD: ${{ secrets.PE_PASSWORD }}
          LOCAL_USERNAME: ${{ secrets.LOCAL_USERNAME }}
          LOCAL_PASSWORD: ${{ secrets.LOCAL_PASSWORD }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\Nutanix VM Resize Disk.ps1" -JsonInputs $env:INPUTS_JSON
