name: Nutanix VM Disk Resizing

on:
  workflow_dispatch:
    inputs:
      site_name:
        description: "Site Name"
        required: true
        default: "Banglore"
        type: choice
        options:
          - Banglore
          - Chennai
          - CPune
      vmname:
        description: "VM Name(s) (Support comma-separated list, e.g. test1,test2)"
        required: true
        type: string
      disk_action:
        description: "Disk Action"
        required: true
        default: "add"
        type: choice
        options:
          - add
          - extend
      SizeGB:
        description: "Disk Size in GB (Support comma-separated list, e.g. 10,20)"
        required: true
        type: string
      DiskAddr:
        description: "Disk Address(es) (Support comma-separated list, e.g. none,scsi.1)"
        required: false
        default: "none"
        type: string
      GuestIP:
        description: "Windows Guest IP(s) (Support comma-separated list, e.g. 192.168.1.10,192.168.1.11)"
        required: true
        type: string
      DriveLetter:
        description: "Drive Letter(s) (Support comma-separated list, e.g. K,L)"
        required: true
        type: string

jobs:
  provision-disk:
    runs-on: self-hosted
    steps:
      - name: Set up job
        run: |
          echo "Starting disk provisioning workflow..."

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Install Posh-SSH
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Posh-SSH)) {
            Install-Module Posh-SSH -Scope CurrentUser -Force -AllowClobber
          }

      - name: Configure WinRM TrustedHosts
        shell: powershell
        run: |
          try {
            Set-Item WSMan:\localhost\Client\TrustedHosts -Value "*" -Force
            Write-Host "WinRM TrustedHosts configured to trust guest IPs successfully."
          } catch {
            Write-Warning "Could not write TrustedHosts: $($_.Exception.Message). Script will fallback to dynamic local settings."
          }

      - name: Execute Disk Provisioning
        shell: powershell
        env:
          PE_USERNAME: ${{ secrets.PE_USERNAME }}
          PE_PASSWORD: ${{ secrets.PE_PASSWORD }}
          LOCAL_USERNAME: ${{ secrets.LOCAL_USERNAME }}
          LOCAL_PASSWORD: ${{ secrets.LOCAL_PASSWORD }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\Nutanix VM Resize Disk.ps1" `
            -site_name "${{ inputs.site_name }}" `
            -vmname "${{ inputs.vmname }}" `
            -disk_action "${{ inputs.disk_action }}" `
            -SizeGB "${{ inputs.SizeGB }}" `
            -DiskAddr "${{ inputs.DiskAddr }}" `
            -GuestIP "${{ inputs.GuestIP }}" `
            -DriveLetter "${{ inputs.DriveLetter }}"
