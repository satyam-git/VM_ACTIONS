name: Nutanix VMResize_cpu&mem

on:
  workflow_dispatch:
    inputs:
      s1: { description: '1: Site Name', required: true, type: choice, options: [Banglore, Chennai, CPune] }
      v1: { description: '1: VM Names (comma separated)', required: true, type: string }
      c1: { description: '1: CPU Cores (applies to all)', required: true, type: string }
      m1: { description: '1: Memory (GB) (applies to all)', required: true, type: string }
      d1: { description: '1: Delays (min, comma separated, same order as VMs)', required: false, default: '0', type: string }
      s2: { description: '2: Site Name', required: false, default: 'None', type: choice, options: [None, Banglore, Chennai, CPune] }
      v2: { description: '2: VM Names (comma separated)', required: false, default: '', type: string }
      c2: { description: '2: CPU Cores (applies to all)', required: false, default: '', type: string }
      m2: { description: '2: Memory (GB) (applies to all)', required: false, default: '', type: string }
      d2: { description: '2: Delays (min, comma separated, same order as VMs)', required: false, default: '0', type: string }

jobs:
  run-compute-resize:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Compute Resize
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          # The PowerShell script writes directly to GITHUB_STEP_SUMMARY environment variable
          & "$env:GITHUB_WORKSPACE\Scripts\VMResize_cpu&mem.ps1" -JsonInputs $env:INPUTS_JSON
