name: Nutanix Batch VM Actions

on:
  workflow_dispatch:
    inputs:
      s1: { description: '1: Site', required: false, type: choice, options: [None, Banglore, Chennai] }
      v1: { description: '1: VM Names (e.g. vm1,vm2)', required: false }
      a1: { description: '1: Action', required: false, type: choice, options: [start, stop, restart] }
      d1: { description: '1: Delays (e.g. 0,20)', required: false, default: '0' }
      s2: { description: '2: Site', required: false, type: choice, options: [None, Banglore, Chennai] }
      v2: { description: '2: VM Names', required: false }
      a2: { description: '2: Action', required: false, type: choice, options: [start, stop, restart] }
      d2: { description: '2: Delays', required: false, default: '0' }
      s3: { description: '3: Site', required: false, type: choice, options: [None, Banglore, Chennai] }
      v3: { description: '3: VM Names', required: false }
      a3: { description: '3: Action', required: false, type: choice, options: [start, stop, restart] }
      d3: { description: '3: Delays', required: false, default: '0' }

jobs:
  run-batch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Execute Actions
        shell: powershell
        env:
          NUTANIX_USER: ${{ secrets.NUTANIX_USER }}
          NUTANIX_PASS: ${{ secrets.NUTANIX_PASS }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: & "$env:GITHUB_WORKSPACE\Scripts\vm-actions.ps1" -JsonInputs $env:INPUTS_JSON
