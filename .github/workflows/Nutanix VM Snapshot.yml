name: Nutanix VM Snapshot Automation
on:
  workflow_dispatch:
    inputs:
      s1:
        description: 'Site Name'
        required: true
        type: choice
        options: [Bangalore, Pune, Chennai]
      v1:
        description: 'VM Name(s)'
        required: true
        type: string
        default: 'test1,test2'
      op:
        description: 'Operation (1:Create, 2:Delete, 3:Restore)'
        required: true
        type: choice
        options: ['1', '2', '3']
      sn1:
        description: 'Snapshot Name(s)'
        required: true
        type: string
        default: 'snap1,snap2'
      d1:
         description: 'Delays in minutes (e.g. 0,2)'
         required: false
         type: string
         default: '0,2'

jobs:
  run-snapshot-job:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Multi-VM Snapshot Operation
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\Nutanix VM Snapshot.ps1" -JsonInputs $env:INPUTS_JSON
