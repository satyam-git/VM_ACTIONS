name: Nutanix VM Snapshot Automation

on:
  workflow_dispatch:
    inputs:
      s1:
        description: 'Site Name'
        required: true
        type: choice
        options:
          - None
          - Bangalore
          - Pune
          - Chennai
      v1:
        description: 'VM Name(s) (supports comma-separated list)'
        required: true
        type: string
        default: 'none'
      op:
        description: 'Operation (1:Create, 2:Delete, 3:Restore)'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      sn1:
        description: 'Snapshot Name(s) (supports comma-separated list, matched sequentially)'
        required: true
        type: string
        default: 'none'
      d1:
         description: 'Independent Delays in minutes (e.g. 20 for all, or 10,30 for sequential)'
         required: false
         type: string
         default: 'none'

jobs:
  run-snapshot-job:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
         uses: actions/checkout@v4

      - name: Run Multi-VM Snapshot Operation
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\Nutanix VM Snapshot.ps1" -JsonInputs $env:INPUTS_JSON
