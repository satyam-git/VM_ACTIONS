name: Nutanix VM Resize

on:
  workflow_dispatch:
    inputs:
      vmname: { description: 'VM Name', required: true }
      cluster_ip: { description: 'Cluster IP', required: true }
      disk_action: { description: 'Disk Action (add/extend)', required: false }
      size_gb: { description: 'Size (GB)', required: false, default: '0' }
      disk_addr: { description: 'Disk Addr (e.g., scsi.0)', required: false }
      guest_ip: { description: 'Guest IP', required: true }
      drive_letter: { description: 'Drive Letter', required: false }
      cpu_val: { description: 'CPU Cores', required: true }
      mem_val: { description: 'Memory (GB)', required: true }
      delay_min: { description: 'Delay (min)', required: false, default: '0' }

jobs:
  run-task:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Resize Script
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          G_USER: ${{ secrets.Local_Username }}
          G_PASS: ${{ secrets.Local_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\vm-resize.ps1" -JsonInputs $env:INPUTS_JSON
