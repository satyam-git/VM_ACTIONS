name: Nutanix VM Resize

on:
  workflow_dispatch:
    inputs:
      vmname: { description: 'VM Name', required: true }
      pE_IP: { description: 'Cluster IP', required: true }
      CPU_size: { description: 'CPU Cores', required: true }
      mem_size: { description: 'Memory (GB)', required: true }
      delay_mins: { description: 'Delay (min)', required: false, default: '0' }
      disk_action: { description: 'Action (add/extend/none)', required: true, default: 'none' }
      size_gb: { description: 'Size (GB)', required: false, default: '0' }
      disk_addr: { description: 'Disk Addr (e.g., scsi.0)', required: false }

jobs:
  run-resize:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Resize
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\vm-resize.ps1" -JsonInputs $env:INPUTS_JSON
