name: Nutanix Unified Management

on:
  workflow_dispatch:
    inputs:
      vmname: { description: 'VM Name', required: true }
      pE_IP: { description: 'Cluster IP', required: true }
      CPU_size: { description: 'CPU Cores', required: true, default: '0' }
      mem_size: { description: 'Memory (GB)', required: true, default: '0' }
      disk_action: { description: 'Disk Action', required: true, default: 'none', type: choice, options: [none, add, extend] }
      SizeGB: { description: 'Disk Size (GB)', required: true, default: '0' }
      DiskAddr: { description: 'Disk Address', required: true, default: none, type: choice, options: [none, scsi.0, scsi.1, scsi.2, scsi.3, scsi.4] }
      GuestIP: { description: 'Guest IP', required: true }
      DriveLetter: { description: 'Drive Letter', required: true }

jobs:
  run-management:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Unified Script
        shell: powershell
        env:
          PE_USER: ${{ secrets.PE_Username }}
          PE_PASS: ${{ secrets.PE_Password }}
          # Ensure these secrets exist in your GitHub repo
          PE_USERNAME: ${{ secrets.PE_USERNAME }} 
          PE_PASSWORD: ${{ secrets.PE_PASSWORD }}
          LOCAL_USERNAME: ${{ secrets.LOCAL_USERNAME }}
          LOCAL_PASSWORD: ${{ secrets.LOCAL_PASSWORD }}
        run: |
          $inputs = @{
            vmname = "${{ inputs.vmname }}"; pE_IP = "${{ inputs.pE_IP }}"; cpu_size = "${{ inputs.CPU_size }}"
            mem_size = "${{ inputs.mem_size }}"; disk_action = "${{ inputs.disk_action }}"; SizeGB = "${{ inputs.SizeGB }}"
            DiskAddr = "${{ inputs.DiskAddr }}"; GuestIP = "${{ inputs.GuestIP }}"; DriveLetter = "${{ inputs.DriveLetter }}"
          }
          $json = $inputs | ConvertTo-Json -Compress
          & "$env:GITHUB_WORKSPACE\Scripts\unified-manage.ps1" -JsonInputs $json
